server:
  port: 8080

spring:
  application:
    name: tlias-web-management

  # 本地开发默认激活 local 配置（application-local.yml 中存放数据库密码，该文件已被 .gitignore 排除）
  # 部署到服务器时可改为：SPRING_PROFILES_ACTIVE=prod 并注入环境变量 DB_PASSWORD
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 以下三项均可通过环境变量覆盖，仓库中不保留任何真实密码
    url: ${DB_URL:jdbc:mysql://localhost:3306/tlias?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
